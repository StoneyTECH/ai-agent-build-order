name: publish
# Releases are cut from GitHub, never from a laptop. Publishing a GitHub release
# runs the suite and publishes that exact commit to npm through trusted
# publishing (OIDC): no npm token exists anywhere to leak, and npm attaches a
# provenance attestation tying the tarball to this workflow run and commit.
# package.json sets publishConfig.provenance, so a publish from anywhere that
# cannot produce provenance fails instead of shipping an unattested build.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # A named environment, so a required reviewer can be added in the repo's
    # settings: the release then waits for a person before it reaches npm.
    environment: npm
    permissions:
      contents: read
      id-token: write   # the OIDC token npm trades for a one-time publish credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. Node 22 still
      # bundles npm 10; Node 24 bundles npm 11.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }

      - name: the release tag names the version being published
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi

      - name: npm can publish through OIDC
        run: |
          if ! printf '%s\n' 11.5.1 "$(npm --version)" | sort -V -C; then
            echo "::error::npm $(npm --version) cannot publish through OIDC; trusted publishing needs >= 11.5.1"
            exit 1
          fi

      - name: tests
        run: node --test

      - name: publish
        run: npm publish
