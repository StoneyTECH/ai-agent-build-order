name: build-order
description: Audit an AI agent build against the nine-gate Build Order. Fails the job on any GAP; attested and unknown never do.
author: StoneyTECH

# Pin this action to a full commit SHA, not a tag. A tag can be moved to other
# code after you review it; a SHA cannot. That is gate 1 applied to your CI.

inputs:
  target:
    description: Directory to audit, relative to the workspace.
    default: '.'
  attest:
    description: Optional attestation JSON that supplies receipts for gates the detectors cannot see.
    default: ''
  ignore:
    description: Optional comma-separated path substrings to leave out of the scan.
    default: ''

runs:
  using: composite
  steps:
    - name: build-order audit
      shell: bash
      # Inputs reach the script only through the environment. Interpolating
      # them into `run` would let a crafted path or ignore list execute as
      # shell, which SECURITY.md lists as a reportable vulnerability.
      env:
        BO_TARGET: ${{ inputs.target }}
        BO_ATTEST: ${{ inputs.attest }}
        BO_IGNORE: ${{ inputs.ignore }}
      run: |
        args=(audit "$BO_TARGET")
        if [ -n "$BO_ATTEST" ]; then args+=(--attest "$BO_ATTEST"); fi
        if [ -n "$BO_IGNORE" ]; then args+=(--ignore "$BO_IGNORE"); fi
        # The scorecard lands on the run's summary page as well as in the log.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then args+=(--out "$GITHUB_STEP_SUMMARY"); fi
        node "$GITHUB_ACTION_PATH/bin/build-order.mjs" "${args[@]}"
